<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tu menú de la semana · Casa Natural</title>
<meta name="description" content="Plantilla interactiva de menú semanal: rellena, guarda e imprime. De Casa Natural.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Courier+Prime:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: #f6f0e4;
    --parchment-deep: #efe6d4;
    --card: #fdfaf3;
    --ink: #3d3227;
    --ink-soft: #5a4f42;
    --terracotta: #b85c38;
    --terracotta-soft: #f0dccd;
    --green: #5f6f52;
    --line: #c9bda8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Courier Prime', monospace;
    background: var(--parchment);
    color: var(--ink);
    padding: 40px 16px 80px 16px;
  }
  .sheet { max-width: 760px; margin: 0 auto; }

  .brand {
    font-family: 'Special Elite', monospace;
    font-size: 0.7rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--green);
    text-align: center;
    margin-bottom: 8px;
  }
  .rule { width: 120px; height: 1px; background: var(--terracotta); margin: 0 auto 22px auto; }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(1.9rem, 5vw, 2.6rem);
    text-align: center;
    margin-bottom: 10px;
  }
  .week-meta {
    font-family: 'Special Elite', monospace;
    font-size: 0.68rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--terracotta);
    text-align: center;
    margin-bottom: 28px;
    display: flex;
    justify-content: center;
    align-items: baseline;
    gap: 6px;
    flex-wrap: wrap;
  }
  .week-meta input {
    font-family: 'Special Elite', monospace;
    font-size: 0.72rem;
    letter-spacing: 1px;
    color: var(--terracotta);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    text-align: center;
    width: 52px;
    outline: none;
  }
  .week-meta input.mes { width: 110px; }

  .day {
    background: var(--card);
    border: 1px solid var(--parchment-deep);
    margin-bottom: 12px;
    padding: 14px 18px 16px 18px;
  }
  .day-name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 1.15rem;
    color: var(--terracotta);
    margin-bottom: 8px;
  }
  .meals { display: flex; gap: 24px; flex-wrap: wrap; }
  .meal { flex: 1; min-width: 240px; }
  .meal-label {
    font-family: 'Special Elite', monospace;
    font-size: 0.58rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--green);
    margin-bottom: 4px;
  }
  .meal input, .day-note input {
    width: 100%;
    font-family: 'Courier Prime', monospace;
    font-size: 0.85rem;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 4px 2px 5px 2px;
    outline: none;
  }
  .meal input:focus, .day-note input:focus, .week-meta input:focus {
    border-bottom-color: var(--terracotta);
  }
  .day-note { margin-top: 10px; }
  .day-note input {
    background: var(--terracotta-soft);
    border-bottom: none;
    border-radius: 2px;
    padding: 6px 10px;
    font-size: 0.75rem;
    color: #8a4a2c;
  }
  .day-note input::placeholder { color: #c09070; }
  .meal input::placeholder { color: #b3a68f; }

  .shopping {
    background: var(--card);
    border: 1px solid var(--parchment-deep);
    padding: 16px 18px 20px 18px;
    margin-top: 20px;
  }
  .shopping h2 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 1.2rem;
    color: var(--terracotta);
    margin-bottom: 10px;
  }
  .shopping textarea {
    width: 100%;
    min-height: 130px;
    font-family: 'Courier Prime', monospace;
    font-size: 0.85rem;
    color: var(--ink);
    background:
      repeating-linear-gradient(transparent, transparent 27px, var(--line) 27px, var(--line) 28px);
    line-height: 28px;
    border: none;
    outline: none;
    resize: vertical;
  }
  .shopping textarea::placeholder { color: #b3a68f; }

  .toolbar {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 30px 0 10px 0;
    flex-wrap: wrap;
  }
  .toolbar button {
    font-family: 'Courier Prime', monospace;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 0.68rem;
    padding: 13px 26px;
    cursor: pointer;
    transition: 0.25s ease;
    border: 1px solid rgba(60,50,40,0.35);
    background: var(--ink);
    color: var(--parchment);
  }
  .toolbar button.secondary {
    background: transparent;
    color: var(--ink);
  }
  .toolbar button:hover { transform: translateY(-1px); }

  .saved-note {
    text-align: center;
    font-size: 0.65rem;
    letter-spacing: 1px;
    color: #a2957e;
    margin-top: 6px;
  }
  .footer {
    margin-top: 40px;
    padding-top: 14px;
    border-top: 1px solid var(--terracotta);
    display: flex;
    justify-content: space-between;
    font-family: 'Special Elite', monospace;
    font-size: 0.6rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--green);
  }
  .footer a { color: var(--green); text-decoration: none; }

  /* ---------- IMPRESIÓN ---------- */
  @media print {
    @page { size: A4; margin: 12mm; }
    body { padding: 0; background: white; }
    .toolbar, .saved-note { display: none !important; }
    .sheet { max-width: none; }
    .day { break-inside: avoid; padding: 8px 14px 10px 14px; margin-bottom: 8px; }
    .day-name { font-size: 1rem; margin-bottom: 4px; }
    .meal input, .day-note input { font-size: 0.72rem; padding: 2px; }
    .shopping textarea { min-height: 110px; }
    input, textarea { border-bottom-color: var(--line) !important; }
    /* Si un campo está vacío, que quede la línea para rellenar a mano */
  }
</style>
</head>
<body>
<div class="sheet">
  <div class="brand">Casa Natural</div>
  <div class="rule"></div>
  <h1>Tu menú de la semana</h1>

  <div class="week-meta">
    <span>Semana del</span>
    <input id="dia1" maxlength="2" inputmode="numeric" placeholder="__">
    <span>al</span>
    <input id="dia2" maxlength="2" inputmode="numeric" placeholder="__">
    <span>de</span>
    <input id="mes" class="mes" placeholder="__________">
  </div>

  <div id="dias"></div>

  <div class="shopping">
    <h2>Lista de la compra</h2>
    <textarea id="compra" placeholder="tomates, garbanzos, pollo..."></textarea>
  </div>

  <div class="toolbar">
    <button onclick="window.print()">Imprimir</button>
    <button class="secondary" onclick="limpiar()">Empezar semana nueva</button>
  </div>
  <p class="saved-note">Se guarda solo en este navegador. Nada sale de tu dispositivo.</p>

  <div class="footer">
    <a href="https://casanatural.studio">casanatural.studio</a>
    <span>@teresaplus</span>
  </div>
</div>

<script>
  const DIAS = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
  const cont = document.getElementById("dias");

  DIAS.forEach((dia, i) => {
    const div = document.createElement("div");
    div.className = "day";
    div.innerHTML = `
      <div class="day-name">${dia}</div>
      <div class="meals">
        <div class="meal">
          <div class="meal-label">Comida</div>
          <input data-key="d${i}-comida" placeholder="">
        </div>
        <div class="meal">
          <div class="meal-label">Cena</div>
          <input data-key="d${i}-cena" placeholder="">
        </div>
      </div>
      <div class="day-note">
        <input data-key="d${i}-nota" placeholder="nota (opcional): aprovechar sobras, invitados, cumpleaños...">
      </div>
    `;
    cont.appendChild(div);
  });

  // Autoguardado en el navegador
  const KEY = "casa-natural-menu";
  const campos = () => document.querySelectorAll("input, textarea");

  function cargar() {
    try {
      const datos = JSON.parse(localStorage.getItem(KEY) || "{}");
      campos().forEach(el => {
        const k = el.dataset.key || el.id;
        if (k && datos[k] !== undefined) el.value = datos[k];
      });
    } catch (e) { /* si no hay nada guardado, no pasa nada */ }
  }

  function guardar() {
    const datos = {};
    campos().forEach(el => {
      const k = el.dataset.key || el.id;
      if (k) datos[k] = el.value;
    });
    try { localStorage.setItem(KEY, JSON.stringify(datos)); } catch (e) {}
  }

  function limpiar() {
    if (!confirm("¿Borrar el menú y empezar una semana nueva?")) return;
    campos().forEach(el => el.value = "");
    try { localStorage.removeItem(KEY); } catch (e) {}
  }

  document.addEventListener("input", guardar);
  cargar();
</script>
</body>
</html>
